name: Build

# Compile MintVID for AmigaOS (m68k) on every push and pull request.
# MintVID uses submodules for MintAMP and libavc, so checkout must recurse.
# The all-in-one Amiga image includes the AmiSSL SDK used by the HTTPS build.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile with the Amiga cross-compiler
        run: |
          docker run --rm -v "$PWD":/src -w /src/player \
            sacredbanana/amiga-compiler:m68k-amigaos \
            bash -c '
              set -e
              AMIGA_GCC="$(command -v m68k-amigaos-gcc)"
              AMIGA_ROOT="$(dirname "$(dirname "$AMIGA_GCC")")"
              echo "Compiler: $AMIGA_GCC"
              "$AMIGA_GCC" --version | head -1
              make -f Makefile.amiga all \
                AMIGA_ROOT="$AMIGA_ROOT" \
                SSL=1 SSLCERTS=1
            '

      - name: Confirm the programs were produced
        run: |
          ls -la player/mrplay player/mrgui player/iptvgui player/ytgui \
            player/mrgui-GT player/iptvgui-GT player/ytgui-GT player/mr_decode
          file player/mrplay player/mrgui player/iptvgui player/ytgui \
            player/mrgui-GT player/iptvgui-GT player/ytgui-GT player/mr_decode || true

      - name: Upload compiled programs
        uses: actions/upload-artifact@v4
        with:
          name: MintVID-AmigaOS
          path: |
            player/mrplay
            player/mrgui
            player/iptvgui
            player/ytgui
            player/mrgui-GT
            player/iptvgui-GT
            player/ytgui-GT
            player/mr_decode
          if-no-files-found: error
