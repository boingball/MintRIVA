name: Build

# Compile MintRIVA for AmigaOS (m68k) on every push and pull request.
# MintRIVA uses submodules for MintAMP and libavc, so checkout must recurse.
# The all-in-one Amiga image includes the AmiSSL SDK used by the HTTPS build.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code and submodules
        uses: actions/checkout@v4
        with:
          ref: fix/h264-1080p-decode
          fetch-depth: 0
          submodules: recursive

      - name: Apply one-shot scheduler gate probe
        shell: python
        run: |
          from pathlib import Path
          p = Path("player/amiga/mrplay.c")
          s = p.read_text()

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              s = s.replace(old, new, 1)

          once(
              "static int h264_pipeline_stage;\nstatic int h264_pipeline_width, h264_pipeline_height;\n",
              "static int h264_pipeline_stage;\nstatic int h264_pipeline_width, h264_pipeline_height;\nstatic int h264_scheduler_diag_written;\n",
              "scheduler diag global")

          marker = "static void control_port_close(void)\n"
          helper = r'''static void h264_scheduler_checkpoint(int rescue_active, int rescue_priority,
                                      int starved, int source, int holdover,
                                      int qcount, unsigned long audio_ms,
                                      uint64_t audio_raw, uint64_t master_clock,
                                      uint64_t mono_clock, uint64_t front_pts,
                                      int64_t late_us)
{
    BPTR fh;
    char buf[384];
    int n;
    if (!h264_pipeline_diag_enabled || h264_scheduler_diag_written) return;
    fh = Open((CONST_STRPTR)"RAM:MintRIVA-H264.scheduler", MODE_NEWFILE);
    if (!fh) return;
    n = snprintf(buf, sizeof buf,
                 "res=%dx%d rescue=%d priority=%d starved=%d source=%d "
                 "holdover=%d qcount=%d audio_ms=%lu audio_raw=%lu "
                 "master=%lu mono=%lu front_pts=%lu late=%ld\n",
                 h264_pipeline_width, h264_pipeline_height,
                 rescue_active, rescue_priority, starved, source, holdover,
                 qcount, audio_ms, (unsigned long)audio_raw,
                 (unsigned long)master_clock, (unsigned long)mono_clock,
                 (unsigned long)front_pts, (long)late_us);
    if (n > 0) {
        LONG bytes = n < (int)sizeof buf ? (LONG)n : (LONG)(sizeof buf - 1);
        Write(fh, (APTR)buf, bytes);
    }
    Close(fh);
    h264_scheduler_diag_written = 1;
}

'''
          once(marker, helper + marker, "scheduler helper")

          once(
              "    h264_pipeline_stage = 0;\n    if (h264_pipeline_diag_enabled)\n",
              "    h264_pipeline_stage = 0;\n    h264_scheduler_diag_written = 0;\n    if (h264_pipeline_diag_enabled)\n",
              "scheduler reset")

          once(
              "            late_us = (int64_t)master_clock_us - (int64_t)front->pts_us;\n            have_deadline = 1;\n        }\n\n        /* Catastrophic fall-behind recovery.",
              "            late_us = (int64_t)master_clock_us - (int64_t)front->pts_us;\n            have_deadline = 1;\n            if (h264_pipeline_diag_enabled && !h264_scheduler_diag_written)\n                h264_scheduler_checkpoint(rescue_active, rescue_priority,\n                                          starved, mc.source, mc.holdover_active,\n                                          qcount, audio_ms, audio_elapsed_raw_us,\n                                          master_clock_us, mono_media_clock_us,\n                                          front->pts_us, late_us);\n        }\n\n        /* Catastrophic fall-behind recovery.",
              "scheduler gate call")

          p.write_text(s)

      - name: Commit source-only probe and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/build.yml
          git add player/amiga/mrplay.c .github/workflows/build.yml
          git commit -m "diag: capture first high-res scheduler presentation gate"
          git push origin HEAD:fix/h264-1080p-decode

      - name: Compile with the Amiga cross-compiler
        run: |
          docker run --rm -v "$PWD":/src -w /src/player \
            sacredbanana/amiga-compiler:m68k-amigaos \
            bash -c '
              set -e
              AMIGA_GCC="$(command -v m68k-amigaos-gcc)"
              AMIGA_ROOT="$(dirname "$(dirname "$AMIGA_GCC")")"
              echo "Compiler: $AMIGA_GCC"
              "$AMIGA_GCC" --version | head -1
              make -f Makefile.amiga all \
                AMIGA_ROOT="$AMIGA_ROOT" \
                SSL=1 SSLCERTS=1
            '

      - name: Confirm the programs were produced
        run: |
          ls -la player/mrplay player/mrgui player/iptvgui player/mr_decode
          file player/mrplay player/mrgui player/iptvgui player/mr_decode || true

      - name: Upload compiled programs
        uses: actions/upload-artifact@v4
        with:
          name: MintRIVA-AmigaOS
          path: |
            player/mrplay
            player/mrgui
            player/iptvgui
            player/mr_decode
          if-no-files-found: error
